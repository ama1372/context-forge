name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: python -m py_compile run.py

      - name: run.py --version
        run: python run.py --version

      - name: run.py --capabilities
        run: python run.py --capabilities

      - name: run.py --check-md
        run: python run.py --check-md

      - name: Verify all README translations exist
        run: |
          for f in README.md README.fa.md README.zh.md README.es.md README.ar.md \
                   README.hi.md README.fr.md README.ru.md README.pt.md README.de.md \
                   README.ja.md README.ko.md README.tr.md README.it.md README.id.md \
                   README.vi.md README.th.md README.he.md README.uk.md; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All 19 README files present."